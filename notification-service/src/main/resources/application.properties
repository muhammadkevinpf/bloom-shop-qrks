quarkus.application.name=notification-service
quarkus.http.port=8084
quarkus.http.cors.enabled=true

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Mailer Configuration (Default connects to local Mailpit)
quarkus.mailer.from=Bloom Shop <orders@bloomshop.com>
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.mock=false

# Kafka Reactive Messaging - Incoming Channel for OrderCreatedEvent
mp.messaging.incoming.order-created-in.connector=smallrye-kafka
mp.messaging.incoming.order-created-in.topic=bloom.orders.created
mp.messaging.incoming.order-created-in.group.id=notification-service-group
mp.messaging.incoming.order-created-in.auto.offset.reset=earliest
mp.messaging.incoming.order-created-in.value.deserializer=com.bloom.notification.consumer.OrderCreatedEventDeserializer

# Observability
quarkus.management.enabled=true
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.smallrye-health.root-path=/health