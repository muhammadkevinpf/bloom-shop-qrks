quarkus.application.name=bloom-gateway
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.swagger-ui.always-include=true

bloom.services.catalog.url=http://localhost:8081
bloom.services.order.url=http://localhost:8082
bloom.services.inventory.url=http://localhost:8083

bloom.keycloak.base-url=http://localhost:8180
bloom.keycloak.realm=bloom
bloom.keycloak.client-id=bloom-app
bloom.keycloak.admin-username=admin
bloom.keycloak.admin-password=admin

quarkus.http.cors=true
quarkus.http.cors.origins=${FRONTEND_URL:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
quarkus.http.cors.exposed-headers=content-disposition,authorization
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true