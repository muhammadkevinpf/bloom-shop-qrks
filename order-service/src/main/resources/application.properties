quarkus.application.name=bloom-order-service
quarkus.http.port=8082
quarkus.http.cors.enabled=true
quarkus.swagger-ui.always-include=true

quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/bloom_db
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

quarkus.flyway.table=flyway_order_history
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0.0.0

quarkus.hibernate-orm.mapping.format.global=ignore

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.incoming.inventory-in.connector=smallrye-kafka
mp.messaging.incoming.inventory-in.topic=bloom.inventory.events
mp.messaging.incoming.inventory-in.group.id=order-service-group
mp.messaging.incoming.inventory-in.auto.offset.reset=earliest
mp.messaging.incoming.inventory-in.value.deserializer=com.bloom.order.messaging.InventoryEventDeserializer

mp.messaging.outgoing.orders-out.connector=smallrye-kafka
mp.messaging.outgoing.orders-out.topic=bloom.orders.created
mp.messaging.outgoing.orders-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.orders-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer

quarkus.rest-client.catalog-client.url=${CATALOG_SERVICE_URL:http://localhost:8081}
quarkus.rest-client.catalog-client.scope=jakarta.enterprise.context.ApplicationScoped

quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180/realms/bloom}
quarkus.oidc.client-id=bloom-app
quarkus.oidc.application-type=service
quarkus.oidc.tls.verification=none